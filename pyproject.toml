[project]
name = "themis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Connor", email = "83981186+utfunderscore@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "modal>=1.0,<2",
    "polars>=2.0.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
onnx = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
training = [
    "numpy>=2,<3",
    "torch==2.8.0",
    "transformers==4.57.1",
    "accelerate>=1.10,<2",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=5,<8",
]
cpu = ["torch==2.8.0"]
cuda = ["torch==2.8.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
themis = "themis:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "basedpyright>=1.40.2",
]
